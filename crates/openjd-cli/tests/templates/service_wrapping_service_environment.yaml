# RFC 0009 §9 item 5.2: a wrapping Service Environment. Its effective runScope
# is [SERVICE], so it defines onWrapEnvEnter, onWrapEnvExit, and the four
# onWrapService* hooks (no onWrapTaskRun), and wraps this one Service alone:
# its onWrapServiceRun re-launches the wrapped onRun through python's
# subprocess module, forwarding stdout so the wrapped openjd_service_ready is
# recognized, after printing WrappedService.*. The Task is not wrapped.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR, WRAP_ACTIONS]
name: "WrappingServiceEnvironment"
jobServices:
  - name: Store
    serviceEnvironments:
      - name: Container
        script:
          actions:
            onWrapEnvEnter:
              command: python
              args: ["{{ Env.File.Launch }}", "WRAPPED_ENV_ENTER", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
            onWrapEnvExit:
              command: python
              args: ["{{ Env.File.Launch }}", "WRAPPED_ENV_EXIT", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
            onWrapServiceEnter:
              command: python
              args: ["{{ Env.File.Launch }}", "WRAPPED_ENTER name={{ WrappedService.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
            onWrapServiceRun:
              command: python
              args: ["{{ Env.File.Launch }}", "WRAPPED_RUN name={{ WrappedService.Name }} ports={{ len(WrappedService.Ports) }} first={{ WrappedService.PortNames[0] }}:{{ WrappedService.Ports[0] }}@{{ WrappedService.BindAddresses[0] }} own={{ Service.Store.main.bindAddress }}:{{ Service.Store.main.port }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
            onWrapServiceReadinessCheck:
              command: python
              args: ["{{ Env.File.Launch }}", "WRAPPED_CHECK", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
            onWrapServiceExit:
              command: python
              args: ["{{ Env.File.Launch }}", "WRAPPED_EXIT name={{ WrappedService.Name }}", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
          embeddedFiles:
            - name: Launch
              type: TEXT
              data: |
                import ast, subprocess, sys
                marker, command, args = sys.argv[1], sys.argv[2], ast.literal_eval(sys.argv[3])
                print(marker, flush=True)
                sys.exit(subprocess.call([command, *args]))
    ports:
      - name: main
    readinessCheck:
      type: STDOUT
      timeoutSeconds: 60
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Store.main.bindAddress }}", "{{ Service.Store.main.port }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import socket, sys
            host, port = sys.argv[1], int(sys.argv[2])
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("openjd_service_ready: store listening", flush=True)
            while True:
                c, _ = s.accept()
                c.sendall(b"ECHO:" + c.recv(1024))
                c.close()
steps:
  - name: Consume
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); c.sendall(b'hello'); print('TASK_REPLY', c.recv(1024).decode(), flush=True)", "{{ Service.Store.main.connectAddress }}", "{{ Service.Store.main.port }}"]
