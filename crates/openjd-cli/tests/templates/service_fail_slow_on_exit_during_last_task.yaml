# "Failure and restart" step 4 when the FAILED verdict is reached during
# the scope's last Task and the Service's onExit is still running when that
# Task completes. The verdict was decided while the scope had work, so it
# stands whatever the teardown timing: Step B must not run and the Job fails.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "FailSlowOnExit"
services:
  - name: S
    ports:
      - name: main
    healthCheck:
      type: STDOUT
    restartPolicy:
      maxAttempts: 0
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(1.5); raise SystemExit(1)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "import time; time.sleep(1.0); print('SVC_ONEXIT')"]
steps:
  - name: A
    dependencies:
      - service: "S"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; time.sleep(2); print('TASK_A_DONE')"]
  - name: B
    dependencies:
      - dependsOn: A
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('STEP_B_MUST_NOT_RUN')"]
