# B (lists A) is re-gated and waiting for A, which is relaunching slowly,
# when the run is interrupted. The interrupt must end the run cleanly (a
# Results summary, no internal "cannot order the start of Services" error).
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "RegateInterrupt"
parameterDefinitions:
  - name: Trace
    type: STRING
services:
  - name: A
    ports: [{ name: main }]
    healthCheck: { type: STDOUT, readinessTimeoutSeconds: 60 }
    restartPolicy: { maxAttempts: 3, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Param.Trace }}"]
          cancelation: { mode: TERMINATE }
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import os, sys, time
            trace = sys.argv[1]
            n = open(trace + '.ac').read().count('x') + 1 if os.path.exists(trace + '.ac') else 1
            open(trace + '.ac', 'a').write('x')
            if n >= 2:
                time.sleep(600)   # second A launch never becomes READY in time
            print('openjd_service_ready: a', flush=True)
            while 'task 1 start' not in (open(trace).read() if os.path.exists(trace) else ''):
                time.sleep(0.05)
            time.sleep(0.2); open(trace, 'a').write('A crash\n'); sys.exit(1)
  - name: B
    dependencies: [{ service: "A" }]
    ports: [{ name: main }]
    healthCheck: { type: STDOUT, readinessTimeoutSeconds: 60 }
    restartPolicy: { maxAttempts: 3, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, time\nt = r'{{ Param.Trace }}'\nn = open(t + '.bc').read().count('x') + 1 if os.path.exists(t + '.bc') else 1\nopen(t + '.bc', 'a').write('x')\nif n == 2:\n    raise SystemExit(7)\nprint('openjd_service_ready: b', flush=True)\nif n == 1:\n    while 'A crash' not in open(t).read():\n        time.sleep(0.05)\n    open(t, 'a').write('B crash\\n'); raise SystemExit(1)\nwhile True:\n    time.sleep(0.2)"]
          cancelation: { mode: TERMINATE }
steps:
  - name: Work
    dependencies: [{ service: "B" }, { service: "A" }]
    parameterSpace:
      taskParameterDefinitions: [{ name: N, type: INT, range: "1-2" }]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; open(r'{{ Param.Trace }}', 'a').write('task {{ Task.Param.N }} start\\n'); time.sleep(1.5 if {{ Task.Param.N }} == 1 else 600)"]
