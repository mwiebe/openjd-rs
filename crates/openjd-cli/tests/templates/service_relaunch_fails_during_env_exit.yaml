# "An exit observed after the scope has completed is not a failure": the
# scope's last Task returns while a relaunch is in flight, and the relaunch
# exits (before READY) during the Step Environment's slow onExit. Scope
# completion must be signaled before the Environments exit, so that exit is
# not a failure: Step B runs and the Job succeeds.
specificationVersion: jobtemplate-2023-09
extensions: [SERVICE, EXPR]
name: RelaunchFailsDuringEnvExit
parameterDefinitions:
  - { name: Marker, type: STRING }
services:
  - name: S
    ports: [{ name: main }]
    healthCheck: { type: STDOUT }
    restartPolicy: { maxAttempts: 1, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, time\nm = r'{{ Param.Marker }}'\nif not os.path.exists(m):\n    open(m, 'w').close(); print('openjd_service_ready: up', flush=True); time.sleep(0.5); raise SystemExit(1)\ntime.sleep(2); raise SystemExit(3)"]
          cancelation: { mode: TERMINATE }
steps:
  - name: A
    dependencies: [{ service: S }]
    stepEnvironments:
      - name: SlowExit
        script:
          actions:
            onEnter: { command: python, args: ["-c", "print('ENV_ENTER')"] }
            onExit: { command: python, args: ["-c", "import time; print('ENV_EXIT_BEGIN', flush=True); time.sleep(3); print('ENV_EXIT_END')"] }
    script: { actions: { onRun: { command: python, args: ["-c", "import time; time.sleep(1.5); print('TASK_A_DONE')"] } } }
  - name: B
    dependencies: [{ dependsOn: A }]
    script: { actions: { onRun: { command: python, args: ["-c", "print('STEP_B_RAN')"] } } }
