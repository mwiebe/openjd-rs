# Two Services that do not depend on one another, both scoped to Step Use,
# are stopped in reverse registration order (the stop_order tie-break run.md
# documents): Second, then First.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "StopOrderIndependent"
services:
  - name: First
    ports:
      - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
  - name: Second
    ports:
      - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
steps:
  - name: Use
    dependencies:
      - service: "First"
      - service: "Second"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN')"]
