# A Job Environment with `activation: ON_REQUEST`, and three Steps that
# run in this order. A and B request it and C does not, so `openjd run` runs
# A and B in one Session that enters it and C in a second Session that does
# not, although no Step has Environment parameter values.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: ActivationGrouping
jobEnvironments:
- name: Always
  script:
    actions:
      onEnter: {command: python, args: ["-c", "print('Always onEnter')"]}
- name: OnRequest
  activation: ON_REQUEST
  variables: {ON_REQUEST: "set"}
  script:
    actions:
      onEnter: {command: python, args: ["-c", "print('OnRequest onEnter')"]}
      onExit: {command: python, args: ["-c", "print('OnRequest onExit')"]}
steps:
- name: A
  dependencies:
  - {environment: OnRequest}
  script: {actions: {onRun: {command: python, args: ["-c", "import os; print('Step A ran ON_REQUEST=' + os.environ.get('ON_REQUEST', 'unset'))"]}}}
- name: B
  dependencies:
  - {dependsOn: A}
  - {environment: OnRequest}
  script: {actions: {onRun: {command: python, args: ["-c", "print('Step B ran')"]}}}
- name: C
  dependencies:
  - {dependsOn: B}
  script: {actions: {onRun: {command: python, args: ["-c", "import os; print('Step C ran ON_REQUEST=' + os.environ.get('ON_REQUEST', 'unset'))"]}}}
