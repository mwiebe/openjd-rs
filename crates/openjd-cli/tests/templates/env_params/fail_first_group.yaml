# Step A fails; Step B has different Environment parameter values, so it
# would run in a second Session. A failure stops the run, so no second
# Session starts.
specificationVersion: jobtemplate-2023-09
extensions: [ENV_PARAMS, EXPR]
name: FailFirstGroup
jobEnvironments:
- name: Seats
  envParameterDefinitions:
  - {name: Count, type: INT, default: 1}
  script:
    actions:
      onEnter:
        command: python
        args: ["-c", "import sys; print('Seats onEnter Count=' + sys.argv[1])", "{{Env.Param.Count}}"]
      onExit:
        command: python
        args: ["-c", "import sys; print('Seats onExit Count=' + sys.argv[1])", "{{Env.Param.Count}}"]
steps:
- name: A
  dependencies:
  - {environment: Seats, parameters: {Count: 2}}
  script: {actions: {onRun: {command: python, args: ["-c", "import sys; print('Step A failing'); sys.exit(3)"]}}}
- name: B
  dependencies:
  - {dependsOn: A}
  script: {actions: {onRun: {command: python, args: ["-c", "print('Step B ran')"]}}}
