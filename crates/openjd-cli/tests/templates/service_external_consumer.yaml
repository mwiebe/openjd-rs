# A Job Template without the SERVICE extension that consumes a queue-supplied
# Service through the CACHE_HOST / CACHE_PORT variables its client Environment
# sets (see service_external_cache.yaml).
specificationVersion: "jobtemplate-2023-09"
name: "ExternalCacheConsumer"
steps:
  - name: Process
    parameterSpace:
      taskParameterDefinitions:
        - name: Frame
          type: INT
          range: "1-2"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Task.Param.Frame }}"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import os, socket, sys
            host, port = os.environ["CACHE_HOST"], int(os.environ["CACHE_PORT"])
            c = socket.create_connection((host, port), timeout=10)
            print("FRAME", sys.argv[1], "CACHE_SAYS", c.recv(64).decode(), flush=True)
            c.close()
