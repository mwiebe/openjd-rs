# Attached before service_env_profile_per_document_env.yaml: the only
# document of the run that declares REDACTED_ENV_VARS. Its Environment
# (ALWAYS, as this document does not list ENV_PARAMS) is entered by the Task
# Session and by the later attachment's Service R, each time under this
# document's profile.
specificationVersion: "environment-2023-09"
extensions: [REDACTED_ENV_VARS]
environment:
  name: Secrets
  script:
    actions:
      onEnter:
        command: python
        args: ["-c", "print('openjd_redacted_env: MY_SECRET=hunter2-secret', flush=True); print('SECRETS_ENTER')"]
