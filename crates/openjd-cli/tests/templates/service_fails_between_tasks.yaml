# Constraint 3 at the gate: a Service's onRun exits while no Task is running
# (during Step A's slow Step Environment onEnter). The readiness gate before
# A's Task must observe the instance failure; with no relaunches the Service
# is FAILED and no Task of A runs.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "FailsBetweenTasks"
services:
  - name: S
    ports:
      - name: main
    healthCheck:
      type: STDOUT
    restartPolicy:
      maxAttempts: 0
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(1); raise SystemExit(1)"]
          cancelation:
            mode: TERMINATE
steps:
  - name: A
    dependencies:
      - service: "S"
    stepEnvironments:
      - name: Slow
        script:
          actions:
            onEnter:
              command: python
              args: ["-c", "import time; print('ENV_ENTERED', flush=True); time.sleep(1.5)"]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_A_RAN')"]
