# RFC 0009 constraint 6 with two Job Environments that list the Step-scoped
# Service S, both requested by Step A: when A completes, both are exited
# (J2, then J1, whose onExit reads S's port) before S is stopped.
specificationVersion: jobtemplate-2023-09
extensions: [SERVICE, ENV_PARAMS, EXPR]
name: T
services:
  - name: S
    ports: [{ name: main }]
    healthCheck: { type: STDOUT }
    script:
      actions:
        onRun: { command: python, args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(60)"], cancelation: { mode: TERMINATE } }
jobEnvironments:
  - name: J1
    activation: ON_REQUEST
    dependencies: [{ service: S }]
    script: { actions: { onEnter: { command: python, args: ["-c", "print('J1_ENTER')"] }, onExit: { command: python, args: ["-c", "print('J1_EXIT {{ Service.S.main.port }}')"] } } }
  - name: J2
    activation: ON_REQUEST
    dependencies: [{ service: S }]
    script: { actions: { onEnter: { command: python, args: ["-c", "print('J2_ENTER')"] }, onExit: { command: python, args: ["-c", "print('J2_EXIT')"] } } }
steps:
  - name: A
    dependencies: [{ environment: J1 }, { environment: J2 }]
    script: { actions: { onRun: { command: python, args: ["-c", "print('STEP_A_RAN')"] } } }
  - name: B
    dependencies: [{ dependsOn: A }]
    script: { actions: { onRun: { command: python, args: ["-c", "print('STEP_B_RAN')"] } } }
