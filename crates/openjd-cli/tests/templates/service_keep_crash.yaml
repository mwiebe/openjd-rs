# Instance failure with completedTasks: KEEP. The Service's first onRun
# instance exits shortly after "task 1 done" appears in the trace, while
# Task 2 runs. Running Tasks continue (Task 2 does not need the Service and
# completes normally), completed Tasks keep their results, and the Service is
# relaunched in the same Session before Task 3 is gated on it.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "KeepCrash"
parameterDefinitions:
  - name: TraceFile
    type: STRING
  - name: MarkerFile
    type: STRING
services:
  - name: Flaky
    ports:
      - name: main
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 60
    restartPolicy:
      maxAttempts: 1
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Param.TraceFile }}", "{{ Param.MarkerFile }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import os, sys, time
            trace, marker = sys.argv[1], sys.argv[2]
            first = not os.path.exists(marker)
            open(marker, "a").close()
            with open(trace, "a") as f:
                f.write("service launch\n")
            print("openjd_service_ready: flaky up", flush=True)
            while True:
                time.sleep(0.1)
                if first and os.path.exists(trace) and "task 1 done" in open(trace).read():
                    time.sleep(0.3)
                    with open(trace, "a") as f:
                        f.write("service crash\n")
                    print("FLAKY_CRASHING", flush=True)
                    sys.exit(1)
steps:
  - name: Work
    dependencies:
      - dependsOn: "service:Flaky"
    parameterSpace:
      taskParameterDefinitions:
        - name: N
          type: INT
          range: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Task.Param.N }}", "{{ Param.TraceFile }}", "{{ Service.Flaky.main.port }}"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import sys, time
            n, trace = sys.argv[1], sys.argv[2]
            with open(trace, "a") as f:
                f.write(f"task {n} start\n")
            time.sleep(1.0)
            with open(trace, "a") as f:
                f.write(f"task {n} done\n")
            print("TASK_DONE", n, flush=True)
