# RFC 0009 §9 item 5: a Job Service with a `serviceEnvironments` entry. The
# Job Environment, the Service Environment, the Service's onEnter / onRun /
# onExit, and the Task append to a trace file so the test can verify the entry
# order (Job Environment, then the Service Environment, then onEnter) and the
# exit order (onExit, then the Service Environment, then the Job Environment).
# The Service Environment's onEnter installs a marker file whose path it
# exports with openjd_env, which onRun reads; it also references the Service's
# own bindAddress, which only a Service Environment may do. The Task runs in a
# Task Session that never enters the Service Environment, so the marker is not
# visible there.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "ServiceEnvironmentsMarker"
parameterDefinitions:
  - name: TraceFile
    type: STRING
jobEnvironments:
  - name: JobEnv
    variables:
      SHARED: job-env
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "open(r'{{ Param.TraceFile }}', 'a').write('job-env enter\\n')"]
        onExit:
          command: python
          args: ["-c", "open(r'{{ Param.TraceFile }}', 'a').write('job-env exit\\n')"]
jobServices:
  - name: Store
    let:
      - marker_name = 'marker-' + Job.Name
    serviceEnvironments:
      - name: Provision
        variables:
          SHARED: service-env
        script:
          actions:
            onEnter:
              command: python
              args:
                - "{{ Env.File.Install }}"
                - "{{ Param.TraceFile }}"
                - "{{ Session.WorkingDirectory }}"
                - "{{ marker_name }}"
                - "{{ Service.Store.main.bindAddress }}:{{ Service.Store.main.port }}"
            onExit:
              command: python
              args: ["-c", "open(r'{{ Param.TraceFile }}', 'a').write('service-env exit\\n')"]
          embeddedFiles:
            - name: Install
              type: TEXT
              data: |
                import os, sys
                trace, wd, name, endpoint = sys.argv[1:5]
                marker = os.path.join(wd, name)
                with open(marker, "w") as f:
                    f.write("bind " + endpoint + "\n")
                with open(trace, "a") as f:
                    f.write("service-env enter SHARED=" + os.environ.get("SHARED", "") + "\n")
                print("openjd_env: STORE_MARKER=" + marker, flush=True)
    ports:
      - name: main
    readinessCheck:
      type: STDOUT
      timeoutSeconds: 60
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "import os; open(r'{{ Param.TraceFile }}', 'a').write('service enter SHARED=' + os.environ.get('SHARED', '') + ' marker=' + ('present' if os.path.exists(os.environ['STORE_MARKER']) else 'absent') + '\\n')"]
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Store.main.bindAddress }}", "{{ Service.Store.main.port }}", "{{ Param.TraceFile }}"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "open(r'{{ Param.TraceFile }}', 'a').write('service exit\\n')"]
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import os, socket, sys
            host, port, trace = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            marker = open(os.environ["STORE_MARKER"]).read().strip()
            with open(trace, "a") as f:
                f.write("service run " + marker + " SHARED=" + os.environ.get("SHARED", "") + "\n")
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("openjd_service_ready: store listening", flush=True)
            while True:
                c, _ = s.accept()
                c.sendall(marker.encode())
                c.close()
steps:
  - name: Consume
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Service.Store.main.connectAddress }}", "{{ Service.Store.main.port }}", "{{ Param.TraceFile }}"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import os, socket, sys
            host, port, trace = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            c = socket.create_connection((host, port), timeout=10)
            reply = c.recv(1024).decode()
            c.close()
            print("TASK_REPLY", reply, flush=True)
            with open(trace, "a") as f:
                f.write("task " + reply + " SHARED=" + os.environ.get("SHARED", "") + " marker-var=" + ("set" if "STORE_MARKER" in os.environ else "unset") + "\n")
