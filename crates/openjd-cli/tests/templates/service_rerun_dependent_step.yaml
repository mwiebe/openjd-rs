# RFC 0009 "RERUN and Step dependencies": Flaky (completedTasks: RERUN,
# maxAttempts 1) is listed by Steps A and B, so its scope is Steps A, B.
# C depends on A and does not list Flaky; B depends on C, so the order
# is A, C, B and Flaky stays up across C. Flaky's first instance exits while
# B's Task runs: B's Task is canceled, A's and B's completed Tasks return to
# the queue, and C -- which depends on A, a returned Step -- returns to
# pending, so C's Task runs twice.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "RerunDependentStep"
parameterDefinitions:
  - name: TraceFile
    type: STRING
  - name: MarkerFile
    type: STRING
services:
  - name: Flaky
    ports:
      - name: main
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 60
    restartPolicy:
      maxAttempts: 1
      completedTasks: RERUN
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Param.TraceFile }}", "{{ Param.MarkerFile }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import os, sys, time
            trace, marker = sys.argv[1], sys.argv[2]
            first = not os.path.exists(marker)
            open(marker, "a").close()
            with open(trace, "a") as f:
                f.write("flaky launch\n")
            print("openjd_service_ready: flaky up", flush=True)
            while True:
                time.sleep(0.1)
                if first and os.path.exists(trace) and "task B start" in open(trace).read():
                    time.sleep(0.3)
                    with open(trace, "a") as f:
                        f.write("flaky crash\n")
                    sys.exit(1)
steps:
  - name: A
    dependencies:
      - service: "Flaky"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "A", "{{ Param.TraceFile }}", "{{ Service.Flaky.main.port }}", "0.2"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import sys, time
            n, trace, delay = sys.argv[1], sys.argv[2], float(sys.argv[4])
            with open(trace, "a") as f:
                f.write(f"task {n} start\n")
            time.sleep(delay)
            with open(trace, "a") as f:
                f.write(f"task {n} done\n")
  - name: C
    dependencies:
      - dependsOn: A
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "C", "{{ Param.TraceFile }}", "none", "0.1"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import sys, time
            n, trace, delay = sys.argv[1], sys.argv[2], float(sys.argv[4])
            with open(trace, "a") as f:
                f.write(f"task {n} start\n")
            time.sleep(delay)
            with open(trace, "a") as f:
                f.write(f"task {n} done\n")
  - name: B
    dependencies:
      - dependsOn: C
      - service: "Flaky"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "B", "{{ Param.TraceFile }}", "{{ Service.Flaky.main.port }}", "1.5"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import sys, time
            n, trace, delay = sys.argv[1], sys.argv[2], float(sys.argv[4])
            with open(trace, "a") as f:
                f.write(f"task {n} start\n")
            time.sleep(delay)
            with open(trace, "a") as f:
                f.write(f"task {n} done\n")
