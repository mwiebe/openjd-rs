# RFC 0009 "Failure and restart" step 1: a RERUN relaunch cancels the running
# Tasks *in the Service's scope*. W's scope is Steps A and C; it exits while
# Step B runs. B's Task is not canceled and B completes; A's completed Tasks
# (and C) return to the queue once B has completed.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "RerunOutsideScope"
parameterDefinitions:
  - { name: Trace, type: STRING }
services:
  - name: W
    ports: [{ name: main }]
    healthCheck: { type: STDOUT }
    restartPolicy: { maxAttempts: 1, completedTasks: RERUN }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os,time\nt=r'{{Param.Trace}}'\nprint('openjd_service_ready: up', flush=True)\nwhile True:\n    time.sleep(0.1)\n    s=open(t).read() if os.path.exists(t) else ''\n    if 'B start' in s and 'W died' not in s:\n        open(t,'a').write('W died\\n'); raise SystemExit(1)"]
          cancelation: { mode: TERMINATE }
steps:
  - name: A
    dependencies: [{ service: W }]
    script: { actions: { onRun: { command: python, args: ["-c", "open(r'{{Param.Trace}}','a').write('A ran\\n')"] } } }
  - name: B
    script: { actions: { onRun: { command: python, args: ["-c", "import time; open(r'{{Param.Trace}}','a').write('B start\\n'); time.sleep(2); open(r'{{Param.Trace}}','a').write('B done\\n')"] } } }
  - name: C
    dependencies: [{ service: W }]
    script: { actions: { onRun: { command: python, args: ["-c", "open(r'{{Param.Trace}}','a').write('C ran\\n')"] } } }
