# RFC 0009: an Environment Template whose environment is a SERVICE-scoped
# wrapping Environment. Attached to a Job whose Service already declares a
# wrapping Service Environment, it is a second wrap layer in that Service's
# Session, which the run must reject before starting anything.
specificationVersion: environment-2023-09
extensions: [WRAP_ACTIONS, SERVICE, EXPR]
environment:
  name: OuterWrap
  runScope: [SERVICE]
  script:
    actions:
      onWrapEnvEnter:
        command: python
        args: ["{{ Env.File.Launch }}", "OUTER_ENV_ENTER", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
      onWrapEnvExit:
        command: python
        args: ["{{ Env.File.Launch }}", "OUTER_ENV_EXIT", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
      onWrapServiceEnter:
        command: python
        args: ["{{ Env.File.Launch }}", "OUTER_SERVICE_ENTER", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
      onWrapServiceRun:
        command: python
        args: ["{{ Env.File.Launch }}", "OUTER_SERVICE_RUN", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
      onWrapServiceReadinessCheck:
        command: python
        args: ["{{ Env.File.Launch }}", "OUTER_SERVICE_CHECK", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
      onWrapServiceExit:
        command: python
        args: ["{{ Env.File.Launch }}", "OUTER_SERVICE_EXIT", "{{ WrappedAction.Command }}", "{{ repr_py(WrappedAction.Args) }}"]
    embeddedFiles:
      - name: Launch
        type: TEXT
        data: |
          import ast, subprocess, sys
          marker, command, args = sys.argv[1], sys.argv[2], ast.literal_eval(sys.argv[3])
          print(marker, flush=True)
          sys.exit(subprocess.call([command, *args]))
