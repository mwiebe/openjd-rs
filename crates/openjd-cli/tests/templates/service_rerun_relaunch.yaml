# Instance failure with completedTasks: RERUN. The Service is scoped to Step
# Work (the only Step that lists it). Its first onRun
# instance exits (code 1) shortly after it sees "task 1 done" in the trace
# file, while Task 2 is running: the runner cancels Task 2, relaunches onRun
# in the same Service Session (the instance had been READY, so a port
# conflict is not suspected), and returns every completed Task of the Step
# to the queue, so Tasks 1-3 run again. The second instance (marker file
# present) serves until the Step completes.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "RerunRelaunch"
parameterDefinitions:
  - name: TraceFile
    type: STRING
  - name: MarkerFile
    type: STRING
services:
  - name: Flaky
    ports:
      - name: main
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 60
    restartPolicy:
      maxAttempts: 1
      completedTasks: RERUN
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Param.TraceFile }}", "{{ Param.MarkerFile }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import os, sys, time
            trace, marker = sys.argv[1], sys.argv[2]
            first = not os.path.exists(marker)
            open(marker, "a").close()
            with open(trace, "a") as f:
                f.write("service launch\n")
            print("openjd_service_ready: flaky up", flush=True)
            while True:
                time.sleep(0.1)
                if first and os.path.exists(trace) and "task 1 done" in open(trace).read():
                    time.sleep(0.3)
                    with open(trace, "a") as f:
                        f.write("service crash\n")
                    print("FLAKY_CRASHING", flush=True)
                    sys.exit(1)
steps:
  - name: Work
    dependencies:
      - dependsOn: "service:Flaky"
    parameterSpace:
      taskParameterDefinitions:
        - name: N
          type: INT
          range: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Task.Param.N }}", "{{ Param.TraceFile }}", "{{ Service.Flaky.main.port }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import sys, time
            n, trace = sys.argv[1], sys.argv[2]
            with open(trace, "a") as f:
                f.write(f"task {n} start\n")
            time.sleep(1.0)
            with open(trace, "a") as f:
                f.write(f"task {n} done\n")
            print("TASK_DONE", n, flush=True)
