# CONTROL_FLOW loops (RFC 0013) CLI test: body Step P's range reads the TaskParam of the loop's dependency A.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR, CONTROL_FLOW]
name: DepTaskParam
steps:
- name: A
  parameterSpace:
    taskParameterDefinitions:
    - {name: I, type: INT, range: [1, 2]}
  outputVariables:
  - {name: V, type: INT}
  script:
    actions:
      onRun: {command: python, args: ['-c', "print('openjd_output_var: V={{Task.Param.I}}')"]}
- name: L
  dependencies: [{dependsOn: A}]
  loop:
    until: "{{Loop.Iteration >= 0}}"
    maxIterations: 1
    steps:
    - name: P
      parameterSpace:
        taskParameterDefinitions:
        - {name: J, type: INT, range: "{{Steps.A.TaskParam.I}}"}
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('P ran {{Task.Param.J}}')"]}
