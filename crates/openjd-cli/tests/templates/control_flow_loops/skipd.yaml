# CONTROL_FLOW loops (RFC 0013) CLI test: Body Step P is skipped at run time by O's output; Q reads its output.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR, CONTROL_FLOW]
name: SkipI
steps:
- name: L
  loop:
    until: "Loop.Iteration >= 0"
    maxIterations: 2
    steps:
    - name: O
      outputVariables:
      - {name: B, type: BOOL}
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('openjd_output_var: B=false')"]}
    - name: P
      dependencies: [{dependsOn: O}]
      enableIf: "Steps.O.Output.B"
      outputVariables:
      - {name: V, type: INT}
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('openjd_output_var: V=4')"]}
    - name: Q
      dependencies: [{dependsOn: P}]
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('Q got', repr('{{Steps.P.Output.V}}'))"]}
