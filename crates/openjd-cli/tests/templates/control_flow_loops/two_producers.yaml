# CONTROL_FLOW loops (RFC 0013) CLI test: body Step Q reads P1 (one Task) and P2 (two Tasks).
specificationVersion: jobtemplate-2023-09
extensions: [EXPR, CONTROL_FLOW]
name: TwoProducers
steps:
- name: L
  loop:
    until: "{{Loop.Iteration >= 0}}"
    maxIterations: 1
    steps:
    - name: P1
      outputVariables:
      - {name: V, type: INT}
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('openjd_output_var: V=1')"]}
    - name: P2
      parameterSpace:
        taskParameterDefinitions:
        - {name: I, type: INT, range: [1, 2]}
      outputVariables:
      - {name: V, type: INT}
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('openjd_output_var: V={{Task.Param.I}}')"]}
    - name: Q
      dependencies: [{dependsOn: P1}, {dependsOn: P2}]
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('Q {{Steps.P1.Output.V}} {{Steps.P2.Output.V}}')"]}
