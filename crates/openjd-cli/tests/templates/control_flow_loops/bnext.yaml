# CONTROL_FLOW loops (RFC 0013) CLI test: Only the loop variable's next reads body Step P.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR, CONTROL_FLOW]
name: Bout
steps:
- name: L
  loop:
    variables:
    - {name: X, type: INT, initial: "{{0}}", next: "{{Steps.P.Output.V}}"}
    until: "Loop.Iteration >= 1"
    maxIterations: 3
    steps:
    - name: P
      outputVariables:
      - {name: V, type: INT}
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('openjd_output_var: V=4')"]}
