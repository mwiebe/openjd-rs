# CONTROL_FLOW loops (RFC 0013) CLI test: loop L is pending on its initial, which reads A, while its maxIterations is known at Job creation. Param.Fail makes A fail.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR, CONTROL_FLOW]
name: KnownBound
parameterDefinitions:
- {name: Fail, type: INT, default: 0}
steps:
- name: A
  outputVariables:
  - {name: V, type: INT}
  script:
    actions:
      onRun: {command: python, args: ['-c', "import sys; print('openjd_output_var: V=1'); sys.exit({{Param.Fail}})"]}
- name: L
  dependencies: [{dependsOn: A}]
  loop:
    variables:
    - {name: X, type: INT, initial: "{{Steps.A.Output.V}}", next: "{{Loop.X + 1}}"}
    until: "Loop.Iteration >= 0"
    maxIterations: 3
    steps:
    - name: P
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('P ran {{Loop.X}}')"]}
