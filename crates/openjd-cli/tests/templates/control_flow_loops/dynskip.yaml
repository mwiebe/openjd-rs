# CONTROL_FLOW loops (RFC 0013) CLI test: Loop L's enableIf reads A, which reports false, so L is skipped at run time; C reads its output in its script.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR, CONTROL_FLOW]
name: Skipped
steps:
- name: A
  outputVariables:
  - {name: On, type: BOOL}
  script:
    actions:
      onRun: {command: python, args: ['-c', "print('openjd_output_var: On=false')"]}
- name: L
  dependencies: [{dependsOn: A}]
  enableIf: "Steps.A.Output.On"
  loop:
    until: "Loop.Iteration >= 0"
    maxIterations: 2
    steps:
    - name: P
      outputVariables:
      - {name: V, type: INT}
      script:
        actions:
          onRun: {command: python, args: ['-c', "print('openjd_output_var: V=5')"]}
  outputVariables:
  - {name: H, type: INT, collect: LAST, value: "{{Steps.P.Output.V}}"}
- name: C
  dependencies: [{dependsOn: L}]
  script:
    actions:
      onRun: {command: python, args: ['-c', "print('C got', repr('{{Steps.L.Output.H}}'))"]}
