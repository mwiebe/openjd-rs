# Job Template whose Job Environment uses REDACTED_ENV_VARS; the external
# Service attached by `--environment service_env_profile_per_document_env.yaml`
# (which does not declare that extension) enters it in its Service Session
# under the Job Template's own profile, so the redacted directive is honored
# there with no warning.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR, REDACTED_ENV_VARS]
name: "EnvProfilePerDocument"
externalServices:
  - name: R
    ports: [{ name: main }]
jobEnvironments:
  - name: Secrets
    script:
      actions:
        onEnter:
          command: python
          args: ["-c", "print('openjd_redacted_env: MY_SECRET=hunter2-secret', flush=True); print('SECRETS_ENTER')"]
steps:
  - name: Use
    dependencies: [{ service: "R" }]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os; print('TASK_SECRET_SET', 'MY_SECRET' in os.environ)"]
