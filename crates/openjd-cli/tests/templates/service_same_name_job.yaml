# RFC 0009 "A shared Valkey store" adapted, submitted alongside
# service_same_name_queue_cache.yaml: both documents declare a Service named
# `Cache`. Service names are scoped to their document (Template Schemas
# §1.2.2 item 2), so the submission is accepted and the two run side by
# side. The Task reaches the Job Template's `Cache` through
# Service.Cache.main.connectAddress / .port and the queue's `Cache` through
# the VALKEY_HOST / VALKEY_PORT the attached client Environment sets, and
# prints what each replied together with its port, proving each consumer got
# its own document's Service.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "Frame Processing With Shared Valkey Store"
parameterDefinitions:
  - name: FrameEnd
    type: INT
    default: 2

services:
  - name: Cache
    description: "A Valkey store the Job's Tasks share to cache and coordinate."
    ports:
      - name: main
    healthCheck:
      type: TCP_CONNECT
      readinessTimeoutSeconds: 60
    restartPolicy:
      maxAttempts: 3
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Cache.main.bindAddress }}", "{{ Service.Cache.main.port }}", "JOB_CACHE"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import socket, sys
            host, port, payload = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("JOB_CACHE_LISTENING", port, flush=True)
            while True:
                c, _ = s.accept()
                data = c.recv(64)
                if data:  # a TCP_CONNECT readiness probe sends nothing
                    c.sendall(payload.encode())
                c.close()

steps:
  - name: ProcessFrames
    dependencies:
      - dependsOn: "service:Cache"
    parameterSpace:
      taskParameterDefinitions:
        - name: Frame
          type: INT
          range: "1-{{ Param.FrameEnd }}"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Task.Param.Frame }}", "{{ Service.Cache.main.connectAddress }}", "{{ Service.Cache.main.port }}"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import os, socket, sys
            frame, job_host, job_port = sys.argv[1], sys.argv[2], int(sys.argv[3])
            env_host, env_port = os.environ["VALKEY_HOST"], int(os.environ["VALKEY_PORT"])
            def ask(host, port):
                c = socket.create_connection((host, port), timeout=10)
                c.sendall(b"GET x")
                reply = c.recv(64).decode()
                c.close()
                return reply
            print("FRAME", frame, "JOB_TEMPLATE_CACHE", job_port, "SAYS", ask(job_host, job_port), flush=True)
            print("FRAME", frame, "QUEUE_CACHE", env_port, "SAYS", ask(env_host, env_port), flush=True)
            print("FRAME", frame, "PORTS_DIFFER", job_port != env_port, flush=True)
