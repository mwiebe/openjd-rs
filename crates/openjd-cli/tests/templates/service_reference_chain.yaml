# A Service (Front) that references an earlier Service's endpoint (Back):
# Front connects to Back when it starts, so it can only start once Back is
# READY (RFC 0009 ordering constraint 2), then serves what Back told it.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "ReferenceChain"
jobServices:
  - name: Back
    ports:
      - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Back.main.bindAddress }}", "{{ Service.Back.main.port }}", "BACK_VALUE"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import socket, sys
            host, port, payload = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("openjd_service_ready: back up", flush=True)
            while True:
                c, _ = s.accept()
                c.sendall(payload.encode())
                c.close()
  - name: Front
    ports:
      - name: main
    readinessCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Front.main.bindAddress }}", "{{ Service.Front.main.port }}", "{{ Service.Back.main.connectAddress }}", "{{ Service.Back.main.port }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import socket, sys
            host, port, back_host, back_port = sys.argv[1], int(sys.argv[2]), sys.argv[3], int(sys.argv[4])
            # Back must already be READY: a refused connection here would exit before READY.
            b = socket.create_connection((back_host, back_port), timeout=2)
            upstream = b.recv(64).decode()
            b.close()
            print("FRONT_GOT_FROM_BACK", upstream, flush=True)
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("openjd_service_ready: front up", flush=True)
            while True:
                c, _ = s.accept()
                c.sendall(("front:" + upstream).encode())
                c.close()
steps:
  - name: Use
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import socket,sys; c=socket.create_connection((sys.argv[1], int(sys.argv[2])), timeout=10); print('TASK_GOT', c.recv(64).decode(), flush=True)", "{{ Service.Front.main.connectAddress }}", "{{ Service.Front.main.port }}"]
