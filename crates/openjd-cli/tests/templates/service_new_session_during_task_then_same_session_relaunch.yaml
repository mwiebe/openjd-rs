# A relaunch that began a new Service Session (new endpoints) while a Task
# ran is remembered for the next gate even when the relaunched instance fails
# again before that gate and is relaunched in the same Session: Front, which
# holds Back's old port, is stopped and started again against the new one.
# Back: launch 1 READY then exit; launch 2 exits before READY (new Session);
# launch 3 READY then exit; launch 4 READY. Task 1 runs 3s, Task 2 is quick.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "PendingReplacedLost"
parameterDefinitions:
  - { name: TraceFile, type: STRING }
  - { name: CounterFile, type: STRING }
services:
  - name: Back
    ports: [{ name: main }]
    healthCheck: { type: STDOUT, readinessTimeoutSeconds: 60 }
    restartPolicy: { maxAttempts: 3, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Param.TraceFile }}", "{{ Param.CounterFile }}", "{{ Service.Back.main.port }}"]
          cancelation: { mode: TERMINATE }
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import os, sys, time
            trace, counter, port = sys.argv[1], sys.argv[2], sys.argv[3]
            n = int(open(counter).read() or "0") + 1 if os.path.exists(counter) else 1
            open(counter, "w").write(str(n))
            with open(trace, "a") as f:
                f.write(f"back launch {n} port {port}\n")
            if n == 2:
                sys.exit(7)
            if n == 4:
                time.sleep(2.5)
            print("openjd_service_ready: back up", flush=True)
            if n in (1, 3):
                time.sleep(0.5); sys.exit(1)
            time.sleep(600)
  - name: Front
    dependencies: [{ service: "Back" }]
    ports: [{ name: main }]
    healthCheck: { type: STDOUT }
    restartPolicy: { maxAttempts: 0, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; open(r'{{ Param.TraceFile }}', 'a').write('front launch backport {{ Service.Back.main.port }}\\n'); print('openjd_service_ready: front up', flush=True); time.sleep(600)"]
          cancelation: { mode: TERMINATE }
steps:
  - name: Work
    dependencies: [{ service: "Front" }]
    parameterSpace:
      taskParameterDefinitions: [{ name: N, type: INT, range: "1-2" }]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time,sys; time.sleep(3 if '{{Task.Param.N}}'=='1' else 0.1); open(r'{{ Param.TraceFile }}', 'a').write('task {{Task.Param.N}} done\\n')"]
