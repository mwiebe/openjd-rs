# See service_same_name_pinned_port_env.yaml.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "SameNamePinnedPort"
parameterDefinitions:
  - name: Port
    type: INT
services:
  - name: Cache
    ports:
      - name: main
        port: "{{ Param.Port }}"
    healthCheck: { type: STDOUT }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation: { mode: TERMINATE }
steps:
  - name: Use
    dependencies: [{ service: "Cache" }]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_MUST_NOT_RUN')"]
