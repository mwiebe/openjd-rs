# After a re-gate (new Session), a later SAME-Session relaunch of the same
# Service must NOT restart its dependents again (constraint 8: a same-Session
# relaunch keeps its ports and requires nothing of dependents). B: launch 1
# READY then crashes during Task 1 (same-Session relaunch); launch 2 exits
# before READY (re-gate, new Session); launch 3 READY then crashes during
# Task 2 (same-Session relaunch); launch 4 is slow so it is still relaunching
# when Task 2 ends and is collected at Task 3's gate. C (lists B) must be
# restarted exactly once — for B's re-gate — and launches twice.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "RegateThenSameSession"
parameterDefinitions:
  - name: Trace
    type: STRING
services:
  - name: A
    ports: [{ name: main }]
    healthCheck: { type: STDOUT }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: a', flush=True); time.sleep(600)"]
          cancelation: { mode: TERMINATE }
  - name: B
    dependencies: [{ service: "A" }]
    ports: [{ name: main }]
    healthCheck: { type: STDOUT, readinessTimeoutSeconds: 20 }
    restartPolicy: { maxAttempts: 5, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Param.Trace }}", "{{ Service.B.main.port }}"]
          cancelation: { mode: TERMINATE }
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import os, sys, time
            trace, port = sys.argv[1], sys.argv[2]
            n = open(trace + '.bc').read().count('x') + 1 if os.path.exists(trace + '.bc') else 1
            open(trace + '.bc', 'a').write('x')
            open(trace, 'a').write(f'B launch {n} port {port}\n')
            if n == 2:
                sys.exit(7)            # exit before READY -> re-gate (new Session)
            if n == 4:
                time.sleep(1.5)        # still relaunching when Task 2 ends
            print('openjd_service_ready: b', flush=True)
            if n == 1:
                while 'task 1 start' not in (open(trace).read() if os.path.exists(trace) else ''):
                    time.sleep(0.05)
                time.sleep(0.2); open(trace, 'a').write('B crash 1\n'); sys.exit(1)
            if n == 3:
                while 'task 2 start' not in open(trace).read():
                    time.sleep(0.05)
                time.sleep(0.2); open(trace, 'a').write('B crash 3\n'); sys.exit(1)
            while True:
                time.sleep(0.2)
  - name: C
    dependencies: [{ service: "B" }]
    ports: [{ name: main }]
    healthCheck: { type: STDOUT }
    restartPolicy: { maxAttempts: 0, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; open(r'{{ Param.Trace }}', 'a').write('C launch bport {{ Service.B.main.port }}\\n'); print('openjd_service_ready: c', flush=True); time.sleep(600)"]
          cancelation: { mode: TERMINATE }
steps:
  - name: Work
    dependencies: [{ service: "C" }, { service: "B" }, { service: "A" }]
    parameterSpace:
      taskParameterDefinitions: [{ name: N, type: INT, range: "1-3" }]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, time\nt = r'{{ Param.Trace }}'\nn = {{ Task.Param.N }}\nopen(t, 'a').write(f'task {n} start\\n')\nif n == 1:\n    time.sleep(2.0)\nelif n == 2:\n    while 'B crash 3' not in open(t).read():\n        time.sleep(0.05)\n    time.sleep(0.1)\nelse:\n    time.sleep(0.1)\nopen(t, 'a').write(f'task {n} done\\n')"]
