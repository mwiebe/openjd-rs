# After an openjd_fail from onRun the Service is UNREADY at once, even while
# onRun is still exiting under a NOTIFY_THEN_TERMINATE grace period: no
# further Task starts against the failed instance (constraint 3), and the
# restart decision is taken even if the exit lands after the last Task would
# otherwise have run. onRun ignores TERM (3 s grace); the Step has 3 short
# Tasks; the failure is reported during Task 1. Tasks 2 and 3 must run only
# after the relaunched instance (launch 2) is READY.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "OnRunOpenjdFailNttGatesTasks"
parameterDefinitions:
  - name: Marker
    type: STRING
services:
  - name: S
    ports: [{ name: main }]
    healthCheck: { type: STDOUT, readinessTimeoutSeconds: 20 }
    restartPolicy: { maxAttempts: 1, completedTasks: KEEP }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, signal, time\nm = r'{{ Param.Marker }}'\nn = int(open(m).read()) + 1 if os.path.exists(m) else 1\nopen(m, 'w').write(str(n))\nsignal.signal(signal.SIGTERM, signal.SIG_IGN)\nprint(f'S launch {n}', flush=True)\nprint('openjd_service_ready: up', flush=True)\nif n == 1:\n    while not os.path.exists(m + '.go'):\n        time.sleep(0.05)\n    print('openjd_fail: store corrupt', flush=True)\nwhile True: time.sleep(0.2)"]
          cancelation:
            mode: NOTIFY_THEN_TERMINATE
            notifyPeriodInSeconds: 3
steps:
  - name: Work
    dependencies: [{ service: "S" }]
    parameterSpace:
      taskParameterDefinitions: [{ name: N, type: INT, range: "1-3" }]
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time\nm = r'{{ Param.Marker }}'\nif {{ Task.Param.N }} == 1:\n    open(m + '.go', 'w').close(); time.sleep(0.6)\nprint('TASK_{{ Task.Param.N }}_DONE')"]
