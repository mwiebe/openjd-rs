# A Service with a requested port keeps its number across a new Service
# Session, and so does a pinned dependent restarted because its upstream's
# endpoints are new: neither is "already allocated to another Service of this
# run". P: launch 1 READY (D starts), exits during Task 1 -> same-Session
# relaunch; launch 2 exits before READY -> new Session (launch 3 READY) -> D
# is stopped and started again in a new Session with its own pinned port.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "PinnedPortsNewSession"
parameterDefinitions:
  - name: Marker
    type: STRING
  - name: PortP
    type: INT
  - name: PortD
    type: INT
services:
  - name: P
    ports:
      - name: main
        port: "{{ Param.PortP }}"
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 10
    restartPolicy:
      maxAttempts: 2
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import os, time\nm = r'{{ Param.Marker }}'\nn = int(open(m).read()) + 1 if os.path.exists(m) else 1\nopen(m, 'w').write(str(n))\nif n == 2:\n    raise SystemExit(3)\nprint('openjd_service_ready: up', flush=True)\nif n == 1:\n    time.sleep(0.5); raise SystemExit(1)\nwhile True: time.sleep(0.2)"]
          cancelation:
            mode: TERMINATE
  - name: D
    dependencies:
      - service: "P"
    ports:
      - name: main
        port: "{{ Param.PortD }}"
    healthCheck:
      type: STDOUT
    restartPolicy:
      maxAttempts: 0
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('D_SEES_P {{ Service.P.main.port }}', flush=True); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
steps:
  - name: S
    dependencies:
      - service: "D"
      - service: "P"
    parameterSpace:
      taskParameterDefinitions:
        - name: N
          type: INT
          range: "1-2"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; time.sleep(1.5 if {{ Task.Param.N }} == 1 else 0); print('TASK_{{ Task.Param.N }}_SEES P={{ Service.P.main.port }} D={{ Service.D.main.port }}')"]
