# Template Schemas §3.2 (RFC 0009): a <StepDependency> is exactly one of
# `dependsOn` or `service`; an entry giving both is rejected at the entry.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "BothKeys"
services:
  - name: Store
    ports:
      - name: main
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
steps:
  - name: Prepare
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
  - name: Use
    dependencies:
      - dependsOn: Prepare
        service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print()"]
