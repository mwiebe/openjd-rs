# RFC 0009 constraint 10: a Step Service is not started when its Step will
# schedule no Task (--tasks '[]'). The Service records any start in the
# marker file, which must stay absent.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "StepNoTasks"
parameterDefinitions:
  - name: MarkerFile
    type: STRING
steps:
  - name: Work
    stepServices:
      - name: Unused
        ports:
          - name: main
        healthCheck:
          type: STDOUT
        script:
          actions:
            onRun:
              command: python
              args: ["-c", "import time; open(r'{{ Param.MarkerFile }}', 'a').write('started\\n'); print('openjd_service_ready: up', flush=True); time.sleep(600)"]
              cancelation:
                mode: TERMINATE
    parameterSpace:
      taskParameterDefinitions:
        - name: N
          type: INT
          range: "1-2"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK', {{ Task.Param.N }})"]
