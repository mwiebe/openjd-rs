# RFC 0009 <ServiceHealthCheck> item 6: failures below failureThreshold do
# not change the Service's state, and "a single successful probe resets the
# count". The COMMAND probe fails exactly twice after READY and then
# recovers; with failureThreshold: 3 the instance stays READY, nothing is
# relaunched, and every Task is served by instance 1. maxAttempts: 1 is given
# so that a wrongly triggered relaunch shows up as INSTANCE 2 rather than as
# a failed Job.
specificationVersion: jobtemplate-2023-09
extensions: [SERVICE, EXPR]
name: HealthThresholdBlips
parameterDefinitions:
  - name: MarkerDir
    type: PATH
services:
  - name: Store
    ports:
      - name: main
    healthCheck:
      type: COMMAND
      readinessIntervalSeconds: 1
      readinessTimeoutSeconds: 60
      healthIntervalSeconds: 1
      failureThreshold: 3
    restartPolicy:
      maxAttempts: 1
      completedTasks: KEEP
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Store.main.bindAddress }}", "{{ Service.Store.main.port }}", "{{ Param.MarkerDir }}"]
          cancelation:
            mode: TERMINATE
        onHealthCheck:
          command: python
          args: ["{{ Service.File.Check }}", "{{ Service.Store.main.connectAddress }}", "{{ Service.Store.main.port }}", "{{ Param.MarkerDir }}"]
          timeout: 10
      embeddedFiles:
        - name: Check
          type: TEXT
          data: |
            import os, socket, sys
            host, port, d = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            try:
                socket.create_connection((host, port), timeout=1).close()
            except OSError:
                sys.exit(1)
            counter = os.path.join(d, "probes")
            n = int(open(counter).read()) if os.path.exists(counter) else 0
            open(counter, "w").write(str(n + 1))
            if n in (1, 2):
                print("CHECK_BLIP", n, flush=True)
                sys.exit(1)
            print("CHECK_OK", n, flush=True)
        - name: Serve
          type: TEXT
          data: |
            import os, socket, sys
            host, port, d = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            marker = os.path.join(d, "marker")
            counter = os.path.join(d, "probes")
            instance = 2 if os.path.exists(marker) else 1
            open(marker, "a").close()
            os.path.exists(counter) and os.remove(counter)
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            print("INSTANCE", instance, "LISTENING", flush=True)
            while True:
                c, _ = s.accept()
                try:
                    data = c.recv(64)
                except OSError:
                    data = b""
                if data:
                    c.sendall(str(instance).encode())
                c.close()
steps:
  - name: Work
    dependencies:
      - service: "Store"
    parameterSpace:
      taskParameterDefinitions:
        - name: N
          type: INT
          range: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Service.Store.main.connectAddress }}", "{{ Service.Store.main.port }}", "{{ Task.Param.N }}"]
          cancelation:
            mode: TERMINATE
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import socket, sys, time
            host, port, n = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            c = socket.create_connection((host, port), timeout=10)
            c.sendall(("task " + n).encode())
            instance = c.recv(64).decode()
            c.close()
            print("TASK", n, "GOT INSTANCE", instance, flush=True)
            time.sleep(2)
            print("TASK", n, "INSTANCE", instance, "DONE", flush=True)
