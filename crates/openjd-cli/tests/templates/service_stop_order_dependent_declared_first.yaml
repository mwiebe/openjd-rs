# Constraint 4 with the dependent declared BEFORE the Service it lists: Front
# (declared first) lists service:Back. Stop order must still be Front, then
# Back; registration order alone would get this wrong.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "StopOrderDependentFirst"
services:
  - name: Front
    dependencies:
      - service: "Back"
    ports:
      - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: front up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('FRONT_ONEXIT')"]
  - name: Back
    ports:
      - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: back up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "print('BACK_ONEXIT')"]
steps:
  - name: Use
    dependencies:
      - service: "Front"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('TASK_RAN')"]
