# Template Schemas §9.1 rule 1 / RFC 0009 lifecycle constraint 6: Coord is
# referenced by Steps Scatter and Gather only, so its scope is exactly those
# two Steps. It starts when Scatter is about to run, one instance holds the
# state written by Scatter's three Tasks and read by Gather's Task, and it is
# stopped (onExit run) once Gather completes -- before Unrelated, which
# depends on Gather and does not reference it, runs. Gather records the
# endpoint in the trace file; Unrelated finds it refused.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "ScopeTwoOfThree"
parameterDefinitions:
  - name: TraceFile
    type: STRING
services:
  - name: Coord
    ports:
      - name: main
    healthCheck:
      type: STDOUT
      readinessTimeoutSeconds: 60
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Service.File.Serve }}", "{{ Service.Coord.main.bindAddress }}", "{{ Service.Coord.main.port }}", "{{ Param.TraceFile }}"]
          cancelation:
            mode: TERMINATE
        onExit:
          command: python
          args: ["-c", "open(r'{{ Param.TraceFile }}', 'a').write('coord exit\\n'); print('COORD_EXIT', flush=True)"]
      embeddedFiles:
        - name: Serve
          type: TEXT
          data: |
            import socket, sys
            host, port, trace = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            s.bind((host, port))
            s.listen(16)
            with open(trace, "a") as f:
                f.write("coord launch\n")
            store = []
            print("openjd_service_ready: coord up", flush=True)
            while True:
                c, _ = s.accept()
                msg = c.recv(256).decode()
                if msg.startswith("PUT "):
                    store.append(msg[4:])
                    c.sendall(b"OK")
                elif msg == "ALL":
                    c.sendall(",".join(sorted(store)).encode())
                c.close()
steps:
  - name: Scatter
    parameterSpace:
      taskParameterDefinitions:
        - name: N
          type: INT
          range: "1-3"
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Service.Coord.main.connectAddress }}", "{{ Service.Coord.main.port }}", "{{ Task.Param.N }}", "{{ Param.TraceFile }}"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import socket, sys
            host, port, n, trace = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
            c = socket.create_connection((host, port), timeout=10)
            c.sendall(b"PUT part" + n.encode())
            reply = c.recv(64).decode()
            c.close()
            print("SCATTER", n, reply, flush=True)
            with open(trace, "a") as f:
                f.write(f"scatter {n}\n")
  - name: Gather
    dependencies:
      - dependsOn: Scatter
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Service.Coord.main.connectAddress }}", "{{ Service.Coord.main.port }}", "{{ Param.TraceFile }}"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import socket, sys
            host, port, trace = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            c = socket.create_connection((host, port), timeout=10)
            c.sendall(b"ALL")
            got = c.recv(256).decode()
            c.close()
            print("GATHERED", got, flush=True)
            with open(trace, "a") as f:
                f.write(f"gather {got}\n")
                f.write(f"endpoint {host} {port}\n")
  - name: Unrelated
    dependencies:
      - dependsOn: Gather
    script:
      actions:
        onRun:
          command: python
          args: ["{{ Task.File.Run }}", "{{ Param.TraceFile }}"]
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            import socket, sys
            trace = sys.argv[1]
            line = [l for l in open(trace).read().splitlines() if l.startswith("endpoint ")][0]
            _, host, port = line.split(" ")
            try:
                socket.create_connection((host, int(port)), timeout=5).close()
                gone = False
            except OSError:
                gone = True
            print("UNRELATED_RAN COORD_GONE", gone, flush=True)
            with open(trace, "a") as f:
                f.write(f"unrelated coord_gone={gone}\n")
