# Template Schemas §3.2 (RFC 0009): a <StepDependency> names a Step with
# `dependsOn` or a Service with `service`, so no character of a Step name is
# reserved. With SERVICE declared, `Layer: Beauty` is an ordinary Step name;
# `Use` lists it with dependsOn and the Service with service, and runs after
# both are satisfied.
specificationVersion: "jobtemplate-2023-09"
extensions: [SERVICE, EXPR]
name: "ColonStepNameAllowed"
services:
  - name: Store
    ports:
      - name: main
    healthCheck:
      type: STDOUT
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(600)"]
          cancelation:
            mode: TERMINATE
steps:
  - name: "Layer: Beauty"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('BEAUTY_STEP_RAN', flush=True)"]
  - name: Use
    dependencies:
      - dependsOn: "Layer: Beauty"
      - service: Store
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('USE_STEP_RAN', '{{ Service.Store.main.port }}', flush=True)"]
