# Not an RFC sample: progressive step input binding (plan, Test strategy). C's
# range reads Steps.P.Output.N and its host requirements read
# Steps.Q.Output.Cpus, where Q depends on P, so C's Tasks are known after P and
# C is ready after Q. With N <= 0, the range takes its fail(...) path as soon
# as P succeeds, before Q runs.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR, CONTROL_FLOW, FEATURE_BUNDLE_1]
name: Progressive binding
parameterDefinitions:
- name: N
  type: INT
  default: 2
steps:
- name: P
  outputVariables:
  - {name: N, type: INT}
  script:
    actions:
      onRun:
        command: python
        args: [-c, "print('openjd_output_var: N={{Param.N}}')"]
- name: Q
  dependencies: [{dependsOn: P}]
  outputVariables:
  - {name: Cpus, type: INT}
  script:
    actions:
      onRun:
        command: python
        args: [-c, "print('openjd_output_var: Cpus=1')"]
- name: C
  dependencies: [{dependsOn: P}, {dependsOn: Q}]
  parameterSpace:
    taskParameterDefinitions:
    - name: I
      type: INT
      range: "{{range(Steps.P.Output.N) if Steps.P.Output.N > 0 else fail('P reported no items')}}"
  hostRequirements:
    amounts:
    - name: amount.worker.vcpu
      min: "{{Steps.Q.Output.Cpus}}"
  script:
    actions:
      onRun:
        command: python
        args: [-c, "print('C task {{Task.Param.I}}')"]
