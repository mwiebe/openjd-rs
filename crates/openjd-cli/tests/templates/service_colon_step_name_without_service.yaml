# Template Schemas §3.1 constraint 4 (RFC 0009): the constraint on `:` in a
# Step's name is gated on the SERVICE extension. Without SERVICE,
# `service:Store` is an ordinary Step name and `dependsOn: service:Store`
# names that Step, so Use runs after it.
specificationVersion: "jobtemplate-2023-09"
name: "ColonStepNameWithoutService"
steps:
  - name: "service:Store"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('STORE_STEP_RAN', flush=True)"]
  - name: Use
    dependencies:
      - dependsOn: "service:Store"
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "print('USE_STEP_RAN', flush=True)"]
