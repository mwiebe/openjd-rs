# RFC 0009 constraint 6: Coord's scope (Step A, through the ON_REQUEST
# Client) completes with A; the Task Session exits Client, whose onExit may
# use Coord, before Coord is stopped, and B (outside the scope) runs after.
specificationVersion: jobtemplate-2023-09
extensions: [SERVICE, ENV_PARAMS, EXPR]
name: C6
jobEnvironments:
  - name: Client
    activation: ON_REQUEST
    dependencies: [{ service: Coord }]
    script:
      actions:
        onEnter: { command: python, args: ["-c", "print('CLIENT_ENTER')"] }
        onExit: { command: python, args: ["-c", "print('CLIENT_EXIT')"] }
services:
  - name: Coord
    ports: [{ name: main }]
    healthCheck: { type: STDOUT }
    script:
      actions:
        onRun:
          command: python
          args: ["-c", "import time; print('openjd_service_ready: up', flush=True); time.sleep(60)"]
          cancelation: { mode: TERMINATE }
steps:
  - name: A
    dependencies: [{ environment: Client }]
    script: { actions: { onRun: { command: python, args: ["-c", "print('STEP_A_RAN')"] } } }
  - name: B
    dependencies: [{ dependsOn: A }]
    script: { actions: { onRun: { command: python, args: ["-c", "print('STEP_B_RAN')"] } } }
